# --- Gradle ---
# 沙箱 cgroup 上限 8 GB（X_IDE_MEMORY_LIMIT=8G），实测两次 oom_kill：
# 一次 -Xmx4096m + parallel，一次 -Xmx4g + in-process，峰值都顶到 8.0 GB。
# 现在压到 3 GB 堆、单 worker，并把 R8 与 Kotlin 编译分成两次独立构建，
# 避免两段峰值叠在同一个 JVM 里。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -XX:MaxDirectMemorySize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process

# --- Android ---
android.useAndroidX=true
